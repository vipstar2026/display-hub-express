# /etc/nginx/snippets/security-headers.conf
# Copy to the VPS, include it inside the server block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI https://vipstar.cc | grep -i content-security
#
# The CSP MUST allow the AFS / OPPWA hosted card page and its 3-D Secure
# challenge frame, otherwise the bank verification screen is blocked and the
# payment can never be authorized.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://eu-prod.oppwa.com https://eu-test.oppwa.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://eu-prod.oppwa.com https://eu-test.oppwa.com; font-src 'self' data: https://fonts.gstatic.com https://eu-prod.oppwa.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https:; child-src 'self' https:; form-action 'self' https:; base-uri 'self'; object-src 'none'" always;
